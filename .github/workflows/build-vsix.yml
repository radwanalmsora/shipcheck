name: Build & publish VSIX

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the Marketplace (needs the VSCE_PAT secret)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self test
        run: node test/selftest.js

      - name: Package with the official vsce
        run: npx --yes @vscode/vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: shipcheck-vsix
          path: "*.vsix"

      - name: Publish to Marketplace
        if: ${{ inputs.publish }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Add the VSCE_PAT repository secret first"
            exit 1
          fi
          npx --yes @vscode/vsce publish --pat "$VSCE_PAT"
