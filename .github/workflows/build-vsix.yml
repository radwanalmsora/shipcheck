name: Build VSIX
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self test
        run: node test/selftest.js
        continue-on-error: true
      - name: Package
        run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: shipcheck-vsix
          path: "*.vsix"
